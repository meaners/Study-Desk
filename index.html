<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153e4a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Study Desk"><meta name="description" content="Your personal flashcards and practice quizzes."><title>Study Desk</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23153e4a'/%3E%3Cpath d='M8 8h16v17H8z' fill='white'/%3E%3Cpath d='M11 13h10M11 17h7' stroke='%23153e4a' stroke-width='2'/%3E%3C/svg%3E"><style>
:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#172f39;background:#f3f6f8;font-size:16px;--ink:#153e4a;--line:#dce5e9;--accent:#c9f078}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;background:#e9eff2;color:var(--ink);padding:13px 19px;font-weight:650;min-height:46px}button:hover{filter:brightness(.96)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #80b435;outline-offset:3px}.primary{background:var(--ink);color:white}.lime{background:var(--accent)}.ghost{background:transparent;border:1px solid var(--line)}.danger{color:#a53131}header{background:var(--ink);color:white;padding:23px max(24px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;gap:12px;align-items:center;font-size:22px;font-weight:750}.mark{background:var(--accent);color:var(--ink);padding:7px 11px;border-radius:9px;font-size:20px}header small{color:#c6d9df;font-size:14px}main{max-width:1120px;margin:auto;padding:36px 24px 70px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:10px;flex-wrap:wrap}h1{font-size:32px;letter-spacing:-1px;margin:0 0 10px}h2{font-size:23px;margin:0}p{line-height:1.6}.muted{color:#617681}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:13px;font-weight:750;color:#617681}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:28px}.set{background:white;border:1px solid var(--line);border-radius:20px;padding:25px;display:flex;flex-direction:column;gap:20px;min-height:240px}.set h2{line-height:1.3}.set .actions{margin-top:auto}.set .stripe{height:5px;width:42px;border-radius:6px;background:var(--accent)}.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:28px;margin-top:24px}.note{font-size:14px;color:#617681;margin-top:25px;max-width:680px}label{display:block;font-weight:650;margin-bottom:8px}input,textarea{width:100%;border:1px solid #bccdd5;background:white;color:#172f39;border-radius:10px;padding:13px;font-size:16px}textarea{min-height:95px;resize:vertical}.cardrow{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;padding:20px 0;border-bottom:1px solid var(--line)}.cardrow button{align-self:center}.field{margin-bottom:20px}.toolbar{margin-top:24px}.flash{width:100%;min-height:340px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px;background:white;box-shadow:0 12px 30px #153e4a0b;border:1px solid var(--line);border-radius:24px;padding:38px;margin:24px 0;color:var(--ink)}.flash .text{font-size:clamp(25px,3vw,38px);font-weight:650;line-height:1.45;white-space:pre-wrap;word-break:break-word;max-width:800px}.flash small{color:#617681;font-weight:400;font-size:14px}.progress{height:6px;background:#dce5e9;border-radius:8px;margin:20px 0;overflow:hidden}.progress div{background:#7cad3d;height:100%}.center{text-align:center}.study{max-width:880px;margin:auto}.options{display:grid;gap:12px;margin-top:25px}.option{text-align:left;background:white;border:1px solid var(--line);white-space:pre-wrap;font-weight:500}.option.correct{background:#e5f3d6;border-color:#6b9a36}.option.wrong{background:#fbe9e8;border-color:#d27975}.feedback{font-weight:650;margin:20px 0;white-space:pre-wrap}.empty{padding:50px;text-align:center}.score{font-size:64px;font-weight:750;color:var(--ink);margin:20px 0}.badge{display:inline-block;border-radius:8px;padding:5px 9px;background:#edf3f6;font-size:14px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:14px 24px;border-radius:12px;background:var(--ink);color:white;z-index:30;box-shadow:0 5px 25px #0002;max-width:90vw}button:disabled{cursor:default;opacity:.65}dialog{border:1px solid var(--line);border-radius:20px;max-width:550px;width:calc(100% - 32px);padding:26px;color:#172f39}dialog::backdrop{background:#153e4a66}.hidden{display:none!important}@media(max-width:650px){header{padding:20px}header small{display:none}main{padding:26px 18px}.cardrow{grid-template-columns:1fr}.cardrow button{justify-self:start}.panel{padding:20px}.flash{min-height:310px;padding:25px}h1{font-size:28px}.actions button{padding:12px 15px}}

.cardrow{grid-template-columns:1fr 1fr;border:0;padding:18px 0 0}.editable-card{border:1px solid var(--line);border-radius:16px;margin-top:20px;padding:20px}.card-number{font-size:18px}.editor-tools{position:sticky;top:0;background:white;padding:14px 0;z-index:2;border-bottom:1px solid var(--line)}.image-editor{margin-top:12px}.image-preview{display:block;max-width:100%;max-height:220px;object-fit:contain;border-radius:10px;background:#edf3f6;margin-bottom:12px}.image-picker{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-height:46px;font-weight:650;cursor:pointer;margin:0;background:#e9eff2}.image-picker:has(+input:focus-visible){outline:3px solid #80b435;outline-offset:3px}.image-picker:has(+input:disabled){pointer-events:none;opacity:.65}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.card-image{display:block;max-width:100%;width:auto;max-height:480px;object-fit:contain;border-radius:10px;margin:18px auto 0}.option-image{display:block;max-width:100%;max-height:220px;object-fit:contain;border-radius:8px;margin:12px 0 0}.side-text{white-space:pre-wrap;overflow-wrap:anywhere}.quiz-question{margin-top:18px;line-height:1.5}.flash .text{width:100%}.feedback .card-image{margin-left:0}.option:disabled{opacity:1}.editable-card textarea{min-height:110px}@media(max-width:650px){.cardrow{grid-template-columns:1fr;gap:24px}.editable-card{padding:16px}.editor-tools{position:static}.card-image{max-height:360px}.image-editor .actions{gap:8px}}
